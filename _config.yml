# Site settings
lang: en-US
title: Bartosz Górka
email: bartosz@bartoszgorka.com
description: >-
  I am a Platform / DevOps & FinOps Engineer working across the infrastructure and software engineering boundary.
  I build and operate shared cloud infrastructure, Kubernetes platforms, observability, and cost governance,
  with a focus on automation, reliability, security, and cost efficiency.
  My background is backend development with a strong emphasis on Domain Driven Design, Elixir/OTP principles, and modular software design.

  The goal I constantly pursue is to build modern and reliable platforms that let businesses move fast without burning money.
  My motto is: Be the change you wish to see in the world.
baseurl: ""
url: https://bartoszgorka.com
use_logo: false
use_copyright: false
timezone: Europe/Warsaw

# https://github.com/mmistakes/jekyll-theme-basically-basic#author
author:
  name: Bartosz Górka
  twitter: bartoszgorka96
  picture: /assets/images/bartoszgorka.jpeg

github_username: bartoszgorka
twitter_username: bartoszgorka96
linkedin_username: bartoszgorka96
logo: /assets/images/bartoszgorka.jpeg

# https://github.com/mmistakes/jekyll-theme-basically-basic#search
search: true
search_full_content: false
search_provider: lunr

# Based on https://github.com/mmistakes/jekyll-theme-basically-basic#google-analytics
# Created copy and changed script to support Google Analytics 4 (GA4)
google_analytics_id: UA-179499509-1

# https://github.com/mmistakes/jekyll-theme-basically-basic#comments-via-disqus
disqus:
  shortname: bartoszgorka

markdown: kramdown
kramdown:
    highlighter: rouge
    syntax_highlighter_opts:
        block:
            line_numbers: true
remote_theme: "mmistakes/jekyll-theme-basically-basic"
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-target-blank
feed:
  path: atom.xml
  tags: true
  posts_limit: 10

target-blank:
   noopener: true
   noreferrer: true
   rel: nofollow

# Pagination - https://github.com/mmistakes/jekyll-theme-basically-basic#pagination
paginate: 15
paginate_path: /page-:num/

# https://github.com/jekyll/jekyll-seo-tag/blob/master/docs/usage.md
twitter:
  username: bartoszgorka96
  card: summary_large_image
social:
  name: Bartosz Górka
  links:
    - https://twitter.com/bartoszgorka96
    - https://www.facebook.com/bartosz.goriusz.gorka
    - https://www.linkedin.com/in/bartoszgorka96
    - https://github.com/bartoszgorka

# Exclude from processing.
exclude:
  - .asset-cache
  - .bundle
  - .github
  - .editorconfig
  - .gitattributes
  - .jekyll-assets-cache
  - .jekyll-cache
  - CHANGELOG
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - node_modules
  - README
  - README.md
  - SECURITY.md
  - CNAME
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      read_time: true
      comments: true

comments:
  giscus:
    enabled: true
    repo: "bartoszgorka/bartoszgorka.github.io"
    repo_id: "MDEwOlJlcG9zaXRvcnkyOTk2NTk5MzI="
    category: "Announcements"
    category_id: "DIC_kwDOEdxynM4CThkc"
    mapping: "pathname"
    reactions_enabled: "1"
    theme: "light"

# Custom links instead of "/:year/:month/:day/:title"
permalink: /:title
