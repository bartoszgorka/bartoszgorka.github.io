version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: 'ci'

  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Warsaw
    labels:
      - dependencies
      - ruby
    commit-message:
      prefix: 'chore(deps)'
